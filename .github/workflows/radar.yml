name: Nazare Big Wave Radar
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 in Portugal in Nov/Dec (UTC)
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or alert"
        default: "daily"
        required: true
        type: choice
        options: [daily, alert]

permissions:
  contents: write

concurrency:
  group: nazare-radar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 8 * * *" ]; then
            echo "value=daily" >> "$GITHUB_OUTPUT"
          else
            echo "value=alert" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch forecast and send email
        env:
          MODE: ${{ steps.mode.outputs.value }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python radar.py
      - name: Save alert de-duplication state
        if: steps.mode.outputs.value == 'alert'
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "nazare-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update Nazaré alert history"
            git push
          fi
